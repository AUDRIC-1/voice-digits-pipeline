# Local cluster: N API containers behind one nginx load balancer.
#   docker compose up -d --build --scale api=3
#   open http://localhost:8080
services:
  api:
    build: .
    image: voice-digits-api
    environment:
      STORAGE_DIR: /app/storage
      # one CPU per container, so adding containers adds capacity
      TF_NUM_INTRAOP_THREADS: "1"
      TF_NUM_INTEROP_THREADS: "1"
      OMP_NUM_THREADS: "1"
      AUTO_RETRAIN: "0"
      PREDICT_CONCURRENCY: "2"
    volumes:
      - storage:/app/storage     # uploads, database and retrained models, shared by every container
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536m
    restart: unless-stopped

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  storage:
