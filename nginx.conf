# Load balancer in front of the API containers.
# `api` resolves to every container of the scaled service; nginx sends
# requests to them in turn (round robin).
upstream api_pool {
    server api:8000;
}

server {
    listen 80;
    client_max_body_size 200m;

    location / {
        proxy_pass http://api_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
    }
}
